name: Shared Dialogue checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-dialogue-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sessions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build standalone session tests
        run: |
          cmake -S tests/shared-dialogue -B build-session-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build-session-tests --parallel 2
          ctest --test-dir build-session-tests --output-on-failure

  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use the validated CMake series
        run: |
          python -m pip install --disable-pip-version-check --target "$env:RUNNER_TEMP/cmake-python" cmake==3.27.9
          if ($LASTEXITCODE) { throw 'CMake preparation failed' }
          "$env:RUNNER_TEMP/cmake-python/cmake/data/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/cache@v4
        with:
          path: deps/downloads
          key: shared-dialogue-archives-${{ runner.os }}-${{ hashFiles('scripts/shared-dialogue/dependencies.json', 'scripts/shared-dialogue/source-archives.json') }}
      - name: Validate scripts and release metadata
        run: ./scripts/shared-dialogue/check-repository.ps1
      - name: Fetch pinned dependencies
        run: ./scripts/shared-dialogue/fetch-dependencies.ps1 *> dependency-fetch.log
      - name: Build dependencies
        run: ./scripts/shared-dialogue/build-dependencies.ps1 -Jobs 4 *> dependency-build.log
      - name: Build client and server
        run: ./scripts/shared-dialogue/build.ps1 -Jobs 4 *> engine-build.log
      - name: Test sessions, packets, live server and runtime libraries
        run: ./scripts/shared-dialogue/test.ps1 -Jobs 4 *> dialogue-tests.log
      - name: Retain diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-dialogue-windows-logs
          if-no-files-found: ignore
          retention-days: 7
          path: |
            *.log
            build-shared-dialogue/dialogue-tests/Testing/Temporary/LastTest.log
            build-shared-dialogue/network-test/server.out.log
            build-shared-dialogue/network-test/server.err.log
